[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveui-prototype"
version = "0.1.0"
description = "A feasibility prototype for runtime-to-source provenance in PySide6 applications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "LibCST>=1.4,<2",
    "PySide6>=6.5,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

